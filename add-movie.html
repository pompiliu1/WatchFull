
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchFull | Add Movie</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>WatchFull</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">My Movies</a>
            <a href="add-movie.html">Add Movie</a>
            <a href="watched.html">Watched</a>
        </nav>
    </header>

    <main>
        <h2>Add a New Movie</h2>
        <p>Add a movie to your personal collection.</p>

        <form id="add-movie-form">
            <label for="movie-title">Movie Title:</label>
            <input type="text" id="movie-title" name="movie-title" required>

            <label for="movie-year">Release Year:</label>
            <input type="number" id="movie-year" name="movie-year" min="1888" max="2026" required>

            <label for="movie-genre">Genre:</label>
            <input type="text" id="movie-genre" name="movie-genre" required>

            <button type="submit">Add Movie</button>
        </form>
        <p id="success-message"></p>
    </main>

    <footer>
        <p>&copy; 2026 WatchFull. All rights reserved.</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
